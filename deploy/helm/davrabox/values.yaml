# Secrets are NOT part of this chart. Create a Secret (by hand, Vault Agent, or External Secrets) with keys:
# POSTGRES_PASSWORD, APP_DB_PASSWORD, KEYCLOAK_ADMIN_PASSWORD, LIVEKIT_API_KEY, LIVEKIT_API_SECRET, DEMO_USER_PASSWORD, ADMIN_API_CLIENT_SECRET
existingSecret: davrabox-secrets

publicHost: davrabox.example.com   # host users reach (one origin: /, /api, /auth, /livekit)

image:
  api: davra/api:dev
  web: davra/web:dev
  pullPolicy: IfNotPresent

# File sharing in the meeting chat needs S3-compatible storage, a ClamAV daemon and a master key. Disabled by default:
# the API then answers 503 to file requests. When enabled, the Secret must also contain S3_ACCESS_KEY, S3_SECRET_KEY, FILE_MASTER_KEY.
files:
  enabled: false
  s3Endpoint: ""      # e.g. https://s3.example.com
  s3Bucket: davra-files
  clamavHost: ""      # host of a clamd daemon (port 3310)

api:
  replicas: 2
  resources: { requests: { cpu: 100m, memory: 192Mi }, limits: { cpu: "1", memory: 512Mi } }
  # Set when postgres is external (production). With postgres.enabled the in-cluster service is used.
  databaseHost: ""
  corsOrigins: ""
  # Redis for shared rate-limit counters, e.g. redis://redis.cache.svc:6379. REQUIRED for correct limits with replicas > 1
  # (without it every replica counts on its own and the API logs a warning at start). Not secret-bearing: use a network-private Redis.
  redisUrl: ""
  trustedProxyHops: 1          # proxies in front of the API that append to X-Forwarded-For

web:
  replicas: 2
  resources: { requests: { cpu: 25m, memory: 32Mi }, limits: { cpu: 250m, memory: 128Mi } }

livekit:
  image: livekit/livekit-server:v1.13.11
  replicas: 1                  # one node per pod; scale with a Redis-backed cluster later
  nodeIp: ""                   # externally reachable IP for ICE (required for media)
  turn:
    enabled: false             # built-in TURN relay for clients behind firewalls that block direct UDP
    udpPort: 3478
    relayRangeStart: 52000
    relayRangeEnd: 52019
    # TURN over TLS (443/5349) needs a public domain and a certificate Secret; see docs/HELD.md
    tlsPort: 0
    domain: ""
    tlsSecret: ""              # Secret with tls.crt and tls.key when tlsPort is set
  resources: { requests: { cpu: 250m, memory: 256Mi }, limits: { cpu: "2", memory: 1Gi } }

# Development-only building blocks. Production uses managed/HA Postgres and a hardened Keycloak.
postgres:
  enabled: true
  image: postgres:17-alpine
  storage: 2Gi
  resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: "1", memory: 512Mi } }

keycloak:
  enabled: true
  image: quay.io/keycloak/keycloak:26.0
  realmJson: ""                # install with --set-file keycloak.realmJson=deploy/keycloak/davrabox-realm.json
  resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: "1500m", memory: 1Gi } }

ingress:
  enabled: false
  className: nginx
  tlsSecret: ""

networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx
