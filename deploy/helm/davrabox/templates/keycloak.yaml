{{- if .Values.keycloak.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  labels:
    {{- include "dvr.labels" . | nindent 4 }}
data:
  davrabox-realm.json: |
{{ required "install with --set-file keycloak.realmJson=deploy/keycloak/davrabox-realm.json" .Values.keycloak.realmJson | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-theme
  labels:
    {{- include "dvr.labels" . | nindent 4 }}
data:
  theme.properties: |
{{ .Files.Get "files/keycloak-theme/login/theme.properties" | indent 4 }}
  messages_uz.properties: |
{{ .Files.Get "files/keycloak-theme/login/messages/messages_uz.properties" | indent 4 }}
  messages_ru.properties: |
{{ .Files.Get "files/keycloak-theme/login/messages/messages_ru.properties" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-email-theme
  labels:
    {{- include "dvr.labels" . | nindent 4 }}
data:
  theme.properties: |
{{ .Files.Get "files/keycloak-theme/email/theme.properties" | indent 4 }}
  html__template.ftl: |
{{ .Files.Get "files/keycloak-theme/email/html/template.ftl" | indent 4 }}
  html__email-verification.ftl: |
{{ .Files.Get "files/keycloak-theme/email/html/email-verification.ftl" | indent 4 }}
  html__password-reset.ftl: |
{{ .Files.Get "files/keycloak-theme/email/html/password-reset.ftl" | indent 4 }}
  html__executeActions.ftl: |
{{ .Files.Get "files/keycloak-theme/email/html/executeActions.ftl" | indent 4 }}
  html__identity-provider-link.ftl: |
{{ .Files.Get "files/keycloak-theme/email/html/identity-provider-link.ftl" | indent 4 }}
  html__email-update-confirmation.ftl: |
{{ .Files.Get "files/keycloak-theme/email/html/email-update-confirmation.ftl" | indent 4 }}
  text__email-verification.ftl: |
{{ .Files.Get "files/keycloak-theme/email/text/email-verification.ftl" | indent 4 }}
  text__password-reset.ftl: |
{{ .Files.Get "files/keycloak-theme/email/text/password-reset.ftl" | indent 4 }}
  text__executeActions.ftl: |
{{ .Files.Get "files/keycloak-theme/email/text/executeActions.ftl" | indent 4 }}
  text__identity-provider-link.ftl: |
{{ .Files.Get "files/keycloak-theme/email/text/identity-provider-link.ftl" | indent 4 }}
  text__email-update-confirmation.ftl: |
{{ .Files.Get "files/keycloak-theme/email/text/email-update-confirmation.ftl" | indent 4 }}
  messages__messages_uz.properties: |
{{ .Files.Get "files/keycloak-theme/email/messages/messages_uz.properties" | indent 4 }}
  messages__messages_ru.properties: |
{{ .Files.Get "files/keycloak-theme/email/messages/messages_ru.properties" | indent 4 }}
  messages__messages_en.properties: |
{{ .Files.Get "files/keycloak-theme/email/messages/messages_en.properties" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    {{- include "dvr.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: keycloak } }
  template:
    metadata: { labels: { app.kubernetes.io/name: keycloak, app.kubernetes.io/part-of: davrabox } }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: keycloak
          image: {{ .Values.keycloak.image }}
          # Dev mode (start-dev). Production uses an optimized image with `start`, TLS at the edge and a hardened realm.
          args: ["start-dev", "--import-realm", "--http-port=8080", "--http-relative-path=/auth", "--proxy-headers=xforwarded", "--hostname=https://{{ .Values.publicHost }}/auth"]
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          env:
            - { name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin }
            - { name: KC_BOOTSTRAP_ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: KEYCLOAK_ADMIN_PASSWORD } } }
            - { name: KC_DB, value: postgres }
            - { name: KC_DB_URL, value: "jdbc:postgresql://{{ include "dvr.dbHost" . }}:5432/keycloak" }
            - { name: KC_DB_USERNAME, value: davra_admin }
            - { name: KC_DB_PASSWORD, valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: POSTGRES_PASSWORD } } }
            - { name: DEMO_USER_PASSWORD, valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: DEMO_USER_PASSWORD } } }
            - { name: ADMIN_API_CLIENT_SECRET, valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: ADMIN_API_CLIENT_SECRET } } }
            - { name: KC_HEALTH_ENABLED, value: "true" }
            - { name: PUBLIC_HOST, value: {{ .Values.publicHost | quote }} }
          ports: [{ name: http, containerPort: 8080 }, { name: mgmt, containerPort: 9000 }]
          readinessProbe: { httpGet: { path: /auth/health/ready, port: mgmt }, initialDelaySeconds: 20, periodSeconds: 5, failureThreshold: 30 }
          resources: {{ toYaml .Values.keycloak.resources | nindent 12 }}
          volumeMounts:
            - { name: realm, mountPath: /opt/keycloak/data/import, readOnly: true }
            - { name: theme, mountPath: /opt/keycloak/themes/davrabox/login, readOnly: true }
            # Branded verification / reset / account-link emails (realm emailTheme=davrabox).
            - { name: email-theme, mountPath: /opt/keycloak/themes/davrabox/email, readOnly: true }
      volumes:
        - { name: realm, configMap: { name: keycloak-realm } }
        - name: theme
          configMap:
            name: keycloak-theme
            items:
              - { key: theme.properties, path: theme.properties }
              - { key: messages_uz.properties, path: messages/messages_uz.properties }
              - { key: messages_ru.properties, path: messages/messages_ru.properties }
        - name: email-theme
          configMap:
            name: keycloak-email-theme
            items:
              - { key: theme.properties, path: theme.properties }
              - { key: html__template.ftl, path: html/template.ftl }
              - { key: html__email-verification.ftl, path: html/email-verification.ftl }
              - { key: html__password-reset.ftl, path: html/password-reset.ftl }
              - { key: html__executeActions.ftl, path: html/executeActions.ftl }
              - { key: html__identity-provider-link.ftl, path: html/identity-provider-link.ftl }
              - { key: html__email-update-confirmation.ftl, path: html/email-update-confirmation.ftl }
              - { key: text__email-verification.ftl, path: text/email-verification.ftl }
              - { key: text__password-reset.ftl, path: text/password-reset.ftl }
              - { key: text__executeActions.ftl, path: text/executeActions.ftl }
              - { key: text__identity-provider-link.ftl, path: text/identity-provider-link.ftl }
              - { key: text__email-update-confirmation.ftl, path: text/email-update-confirmation.ftl }
              - { key: messages__messages_uz.properties, path: messages/messages_uz.properties }
              - { key: messages__messages_ru.properties, path: messages/messages_ru.properties }
              - { key: messages__messages_en.properties, path: messages/messages_en.properties }
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    {{- include "dvr.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: keycloak }
  ports: [{ name: http, port: 8080, targetPort: http }]
{{- end }}
