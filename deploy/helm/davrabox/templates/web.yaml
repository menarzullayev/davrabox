apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    {{- include "dvr.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector: { matchLabels: { app.kubernetes.io/name: web } }
  template:
    metadata: { labels: { app.kubernetes.io/name: web, app.kubernetes.io/part-of: davrabox } }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- include "dvr.podSecurity" . | nindent 6 }}
      containers:
        - name: web
          image: {{ .Values.image.web }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "dvr.containerSecurity" . | nindent 10 }}
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /, port: http }, periodSeconds: 5 }
          resources: {{ toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    {{- include "dvr.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: web }
  ports: [{ name: http, port: 8080, targetPort: http }]
