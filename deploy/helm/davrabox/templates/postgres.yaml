{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  labels:
    {{- include "dvr.labels" . | nindent 4 }}
data:
  01-init.sh: |
    #!/bin/sh
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<EOSQL
    CREATE DATABASE keycloak;
    CREATE ROLE davra_app LOGIN PASSWORD '${APP_DB_PASSWORD}' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;
    GRANT CONNECT ON DATABASE davra TO davra_app;
    EOSQL
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    {{- include "dvr.labels" . | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: postgres } }
  template:
    metadata: { labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: davrabox } }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext: { fsGroup: 70, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          # Dev-only component: the postgres image needs a writable root filesystem.
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"], add: ["CHOWN", "SETUID", "SETGID", "FOWNER", "DAC_OVERRIDE"] } }
          env:
            - { name: POSTGRES_USER, value: davra_admin }
            - { name: POSTGRES_DB, value: davra }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: POSTGRES_PASSWORD } } }
            - { name: APP_DB_PASSWORD, valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: APP_DB_PASSWORD } } }
          ports: [{ name: pg, containerPort: 5432 }]
          readinessProbe: { exec: { command: ["pg_isready", "-U", "davra_admin", "-d", "davra"] }, periodSeconds: 5 }
          resources: {{ toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
      volumes:
        - { name: init, configMap: { name: postgres-init, defaultMode: 0555 } }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: ["ReadWriteOnce"], resources: { requests: { storage: {{ .Values.postgres.storage }} } } }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "dvr.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: postgres }
  ports: [{ name: pg, port: 5432, targetPort: pg }]
{{- end }}
