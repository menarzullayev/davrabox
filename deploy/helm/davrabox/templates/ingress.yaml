{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: davrabox
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tlsSecret }}
  tls: [{ hosts: [{{ .Values.publicHost | quote }}], secretName: {{ .Values.ingress.tlsSecret }} }]
  {{- end }}
  rules:
    - host: {{ .Values.publicHost }}
      http:
        paths:
          - { path: /auth, pathType: Prefix, backend: { service: { name: keycloak, port: { number: 8080 } } } }
          - { path: /api, pathType: Prefix, backend: { service: { name: api, port: { number: 3000 } } } }
          - { path: /livekit, pathType: Prefix, backend: { service: { name: livekit, port: { number: 7880 } } } }
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 8080 } } } }
{{- end }}
