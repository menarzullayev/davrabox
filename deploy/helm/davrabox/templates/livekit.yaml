apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit-config
  labels:
    {{- include "dvr.labels" . | nindent 4 }}
data:
  livekit.yaml: |
    port: 7880
    bind_addresses: ["0.0.0.0"]
    rtc:
      tcp_port: 7881
      udp_port: 7882
      use_external_ip: false
    room:
      auto_create: false
      empty_timeout: 300
      max_participants: 300
    logging: { level: info }
    {{- if .Values.livekit.turn.enabled }}
    turn:
      enabled: true
      udp_port: {{ .Values.livekit.turn.udpPort }}
      relay_range_start: {{ .Values.livekit.turn.relayRangeStart }}
      relay_range_end: {{ .Values.livekit.turn.relayRangeEnd }}
      {{- if .Values.livekit.turn.tlsPort }}
      tls_port: {{ .Values.livekit.turn.tlsPort }}
      domain: {{ required "livekit.turn.domain is required with tlsPort" .Values.livekit.turn.domain | quote }}
      cert_file: /etc/livekit-tls/tls.crt
      key_file: /etc/livekit-tls/tls.key
      {{- end }}
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
  labels:
    app.kubernetes.io/name: livekit
    {{- include "dvr.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.livekit.replicas }}
  selector: { matchLabels: { app.kubernetes.io/name: livekit } }
  template:
    metadata: { labels: { app.kubernetes.io/name: livekit, app.kubernetes.io/part-of: davrabox } }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: livekit
          image: {{ .Values.livekit.image }}
          args: ["--config", "/etc/livekit/livekit.yaml"{{ if .Values.livekit.nodeIp }}, "--node-ip", {{ .Values.livekit.nodeIp | quote }}{{ end }}]
          {{- include "dvr.containerSecurity" . | nindent 10 }}
          env:
            - { name: LIVEKIT_API_KEY, valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: LIVEKIT_API_KEY } } }
            - { name: LIVEKIT_API_SECRET, valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: LIVEKIT_API_SECRET } } }
            - { name: LIVEKIT_KEYS, value: "$(LIVEKIT_API_KEY): $(LIVEKIT_API_SECRET)" }
          ports:
            - { name: http, containerPort: 7880 }
            - { name: rtc-tcp, containerPort: 7881 }
            - { name: rtc-udp, containerPort: 7882, protocol: UDP }
            {{- if .Values.livekit.turn.enabled }}
            - { name: turn-udp, containerPort: {{ .Values.livekit.turn.udpPort }}, protocol: UDP }
            {{- end }}
          readinessProbe: { httpGet: { path: /, port: http }, periodSeconds: 5 }
          resources: {{ toYaml .Values.livekit.resources | nindent 12 }}
          volumeMounts:
            - { name: cfg, mountPath: /etc/livekit }
            {{- if .Values.livekit.turn.tlsPort }}
            - { name: turn-tls, mountPath: /etc/livekit-tls, readOnly: true }
            {{- end }}
      volumes:
        - { name: cfg, configMap: { name: livekit-config } }
        {{- if .Values.livekit.turn.tlsPort }}
        - { name: turn-tls, secret: { secretName: {{ required "livekit.turn.tlsSecret is required with tlsPort" .Values.livekit.turn.tlsSecret }} } }
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: livekit
  labels:
    {{- include "dvr.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: livekit }
  ports:
    - { name: http, port: 7880, targetPort: http }
    - { name: rtc-tcp, port: 7881, targetPort: rtc-tcp }
    - { name: rtc-udp, port: 7882, targetPort: rtc-udp, protocol: UDP }
    {{- if .Values.livekit.turn.enabled }}
    - { name: turn-udp, port: {{ .Values.livekit.turn.udpPort }}, targetPort: turn-udp, protocol: UDP }
    {{- end }}
