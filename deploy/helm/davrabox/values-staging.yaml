  api: ghcr.io/menarzullayev/davrabox-api:sha-34d6d0f
  web: ghcr.io/menarzullayev/davrabox-web:sha-34d6d0f
  pullPolicy: IfNotPresent

publicHost: staging.davrabox.local

api:
  replicas: 1
web:
  replicas: 1
