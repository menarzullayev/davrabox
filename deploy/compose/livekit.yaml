port: 7880
bind_addresses:
  - "0.0.0.0"
rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: false
# Shared with LiveKit Egress (meeting recording): the egress service receives its jobs and reports status through Redis.
redis:
  address: redis:6379
room:
  auto_create: false
  empty_timeout: 300
  max_participants: 300
logging:
  level: info
# Internal metrics for Prometheus and the load test (published on loopback only).
prometheus_port: 6789
turn:
  # Built-in TURN relay for participants behind firewalls that block direct UDP. UDP here; TURN over TLS (port 443/5349)
  # additionally needs a public domain and a certificate: see the commented block and docs/HELD.md.
  enabled: true
  udp_port: 3478
  relay_range_start: 52000
  relay_range_end: 52019
  # tls_port: 5349
  # domain: turn.example.com
  # cert_file: /etc/livekit/turn.crt
  # key_file: /etc/livekit/turn.key
