# DavraBox dev stack. All containers are prefixed davra-, resource-limited, and bound to high ports.
name: davra
services:
  postgres:
    image: postgres:17-alpine
    container_name: davra-postgres
    environment:
      POSTGRES_USER: davra_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: davra
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - davra-pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:55432:5432"
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U davra_admin -d davra"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: davra-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:56379:6379"
    mem_limit: 128m
    cpus: 0.5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: davra-keycloak
    command: ["start-dev", "--import-realm", "--http-port=8080", "--http-relative-path=/auth", "--proxy-headers=xforwarded"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: davra_admin
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD}
      PUBLIC_HOST: ${LAN_IP}:8443
    volumes:
      - ../keycloak/davrabox-realm.json:/opt/keycloak/data/import/davrabox-realm.json:ro
    ports:
      - "${LAN_IP}:8180:8080"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1g
    cpus: 1.5

  livekit:
    image: livekit/livekit-server:v1.13.11
    container_name: davra-livekit
    command: ["--config", "/etc/livekit.yaml", "--node-ip", "${LAN_IP}"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "${LAN_IP}:7880:7880"
      - "${LAN_IP}:7881:7881"
      - "${LAN_IP}:7882:7882/udp"
    mem_limit: 1g
    cpus: 2

  caddy:
    image: caddy:2-alpine
    container_name: davra-caddy
    environment:
      LAN_IP: ${LAN_IP}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - davra-caddy-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${LAN_IP}:8443:8443"
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:58081:8081"
    depends_on:
      - keycloak
      - livekit
    mem_limit: 128m
    cpus: 0.5

volumes:
  davra-pgdata:
  davra-caddy-data:
