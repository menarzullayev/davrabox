# DavraBox dev stack. All containers are prefixed davra-, resource-limited, and bound to high ports.
name: davra
services:
  postgres:
    image: postgres:17-alpine
    container_name: davra-postgres
    environment:
      POSTGRES_USER: davra_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: davra
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - davra-pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:55432:5432"
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U davra_admin -d davra"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: davra-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:56379:6379"
    mem_limit: 128m
    cpus: 0.5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: davra-keycloak
    command: ["start-dev", "--import-realm", "--http-port=8080", "--http-relative-path=/auth", "--proxy-headers=xforwarded"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: davra_admin
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD}
      ADMIN_API_CLIENT_SECRET: ${ADMIN_API_CLIENT_SECRET}
      PUBLIC_HOST: ${LAN_IP}:8443
    volumes:
      - ../keycloak/davrabox-realm.json:/opt/keycloak/data/import/davrabox-realm.json:ro
      - ../helm/davrabox/files/keycloak-theme:/opt/keycloak/themes/davrabox:ro
    ports:
      - "${LAN_IP}:8180:8080"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1g
    cpus: 1.5

  livekit:
    image: livekit/livekit-server:v1.13.11
    container_name: davra-livekit
    command: ["--config", "/etc/livekit.yaml", "--node-ip", "${LAN_IP}"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "${LAN_IP}:7880:7880"
      - "${LAN_IP}:7881:7881"
      - "${LAN_IP}:7882:7882/udp"
      - "${LAN_IP}:3478:3478/udp"
      - "127.0.0.1:56789:6789"
      - "${LAN_IP}:52000-52019:52000-52019/udp"
    depends_on:
      - redis
    mem_limit: 1g
    cpus: 2

  # Meeting recording. Joins the room as a hidden recorder (headless Chrome + GStreamer) and writes an MP4 to the
  # `davra-recordings` bucket in MinIO; the API then encrypts it. Needs the shared redis and SYS_ADMIN for the Chrome sandbox.
  # Room composite at 720p30 needs about 4 CPUs; verified 2026-11-24 (see docs/PROGRESS.md).
  egress:
    image: livekit/egress:v1.15.0
    container_name: davra-egress
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ./egress.yaml:/etc/egress.yaml:ro
    cap_add:
      - SYS_ADMIN
    shm_size: 1gb
    depends_on:
      - redis
      - livekit
      - minio
    mem_limit: 4g
    cpus: 4

  caddy:
    image: caddy:2-alpine
    container_name: davra-caddy
    environment:
      LAN_IP: ${LAN_IP}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - davra-caddy-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${LAN_IP}:8443:8443"
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:58081:8081"
    depends_on:
      - keycloak
      - livekit
    mem_limit: 128m
    cpus: 0.5

  # Dev object store for shared files (S3 API). Production: managed S3-compatible storage.
  minio:
    image: cgr.dev/chainguard/minio:latest-dev@sha256:5735e8125c4af7dd310dc5780508bfb850f0b68783a1a56089b5c64316a8f603
    container_name: davra-minio
    command: ["server", "/data", "--address", ":9000"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - davra-minio-data:/data
    ports:
      - "127.0.0.1:59000:9000"
    mem_limit: 512m
    cpus: 1

  # Antivirus for uploaded files (clamd on 3310). Needs ~1.5 GB RAM and downloads signatures on first start.
  clamav:
    image: clamav/clamav:1.4.7
    container_name: davra-clamav
    ports:
      - "127.0.0.1:53310:3310"
    volumes:
      - davra-clamav-db:/var/lib/clamav
    mem_limit: 2g
    cpus: 1.5
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s

volumes:
  davra-pgdata:
  davra-minio-data:
  davra-clamav-db:
  davra-caddy-data:
