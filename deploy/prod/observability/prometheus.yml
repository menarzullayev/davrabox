# Prometheus for the DavraBox production host. Everything is scraped over the internal Docker network; nothing here is public.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    site: davrabox

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  # The API serves /metrics on its own internal port (METRICS_PORT 9100), never on the public one.
  - job_name: api
    static_configs:
      - targets: ["api:9100"]

  # LiveKit: prometheus_port 6789 in livekit.yaml.
  - job_name: livekit
    static_configs:
      - targets: ["livekit:6789"]

  # Caddy: the internal-only :9180 listener in the Caddyfile (per-server request metrics are enabled there).
  - job_name: caddy
    static_configs:
      - targets: ["caddy:9180"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: blackbox
    static_configs:
      - targets: ["blackbox:9115"]

  # Uptime and certificate probes of the PUBLIC address, from this host. The target list is generated by Compose
  # from PUBLIC_HOST (see the `configs` entry in docker-compose.observability.yml).
  - job_name: blackbox-public
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files: ["/etc/prometheus/targets/public.yml"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
