# ArgoCD Application for the dev/staging environment (GitOps). Requires ArgoCD installed in the cluster and
# the davrabox-secrets Secret provisioned out of band (Vault / External Secrets). Not applied in local validation.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: davrabox-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/menarzullayev/davrabox.git
    targetRevision: main
    path: deploy/helm/davrabox
    helm:
      valueFiles: [values.yaml]
      parameters:
        - { name: publicHost, value: staging.example.com }
      fileParameters:
        - { name: keycloak.realmJson, path: ../../keycloak/davrabox-realm.json }
  destination:
    server: https://kubernetes.default.svc
    namespace: davrabox
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
