server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' wss: https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  # No add_header inside locations: nginx would then drop the server-level security headers above.
  location /assets/ { expires 1y; }
  # Digital Asset Links for the Android app: exists only when built with ANDROID_SHA256_CERT_FINGERPRINT, else a real 404.
  location = /.well-known/assetlinks.json { default_type application/json; try_files $uri =404; }
  # Written at container start by docker/40-runtime-config.sh (GLITCHTIP_WEB_DSN); {"glitchtipDsn":""} means error tracking is off.
  location = /runtime-config.json { alias /tmp/runtime-config.json; default_type application/json; expires -1; }
  location / { try_files $uri /index.html; expires -1; }
}
