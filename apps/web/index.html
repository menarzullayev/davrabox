<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0d21" />
    <meta name="description" content="DavraBox: xavfsiz, mahalliy, sizning nazoratingizdagi korporativ videokonferensiya." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="DavraBox" />
    <meta property="og:description" content="Xavfsiz. Mahalliy. Sizning nazoratingizda." />
    <meta property="og:image" content="%DAVRA_PUBLIC_URL%/brand/social-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>DavraBox</title>
    <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/brand/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/brand/favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/onest-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script src="/theme-init.js"></script>
    <style>
      /* Boot screen: visible as soon as the HTML arrives, replaced when React mounts (no script, so the CSP is unaffected). */
      html { background: #0a0d21; }
      html[data-theme='light'] { background: #f4f5fb; }
      .boot { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
      .boot img { width: 120px; height: 120px; }
      .boot i { width: 28px; height: 28px; border-radius: 50%; border: 3px solid rgba(58, 214, 202, 0.25); border-top-color: #3ad6ca; animation: boot-spin 0.9s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot i { animation-duration: 3s; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" role="status" aria-label="DavraBox"><img src="/brand/favicon.svg" alt="" width="120" height="120" /><i aria-hidden="true"></i></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
