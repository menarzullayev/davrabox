name: Publish images and bump staging

# Runs only after the CI workflow succeeded on main. Builds the api and web images for linux/amd64 and linux/arm64 (each on a
# native runner: argon2 is a native module), pushes them to GHCR as one multi-arch tag per commit, then records those tags in values-staging.yaml; ArgoCD (watching main) rolls
# staging forward from that file. The bump commit carries [skip ci] so it does not start another cycle.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names
        id: names
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "api=ghcr.io/${owner}/davrabox-api" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${owner}/davrabox-web" >> "$GITHUB_OUTPUT"
      # Each architecture is pushed by digest only; the merge job below joins them under the commit tag.
      - id: api
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ steps.names.outputs.api }},push-by-digest=true,name-canonical=true,push=true
      - id: web
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ steps.names.outputs.web }},push-by-digest=true,name-canonical=true,push=true
      - name: Record digests
        run: |
          mkdir -p digests
          echo "${{ steps.api.outputs.digest }}" > "digests/api-${{ matrix.arch }}"
          echo "${{ steps.web.outputs.digest }}" > "digests/web-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: digests/
          retention-days: 1

  images:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tag
        id: tag
        run: echo "sha=sha-${GITHUB_EVENT_SHA:0:7}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
      - name: Multi-arch tags (amd64 + arm64)
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for img in api web; do
            repo="ghcr.io/${owner}/davrabox-${img}"
            docker buildx imagetools create -t "${repo}:${TAG}" -t "${repo}:main"               "${repo}@$(cat "digests/${img}-amd64")" "${repo}@$(cat "digests/${img}-arm64")"
            docker buildx imagetools inspect "${repo}:${TAG}" | grep -E 'Platform: +linux/(amd64|arm64)$'
          done
        env:
          TAG: ${{ steps.tag.outputs.sha }}
      - name: Bump staging image tags
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python3 - <<'PY'
          import os, re
          owner = os.environ["OWNER"].lower()
          tag = os.environ["TAG"]
          p = "deploy/helm/davrabox/values-staging.yaml"
          s = open(p).read()
          s = re.sub(r"(api: ghcr\.io/[^:\n]+):\S+", rf"api: ghcr.io/{owner}/davrabox-api:{tag}", s)
          s = re.sub(r"(web: ghcr\.io/[^:\n]+):\S+", rf"web: ghcr.io/{owner}/davrabox-web:{tag}", s)
          open(p, "w").write(s)
          PY
          git config user.name "davrabox-ci"
          git config user.email "ci@davrabox.invalid"
          git add deploy/helm/davrabox/values-staging.yaml
          git diff --cached --quiet || (git commit -m "chore(staging): deploy ${TAG} [skip ci]" && git push origin main)
        env:
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ steps.tag.outputs.sha }}
